name: Claude Code Review

# Automatic review plus @claude replies.
# Requires the Claude GitHub App (https://github.com/apps/claude) and the
# repository secret CLAUDE_CODE_OAUTH_TOKEN (Max subscription token from
# `claude setup-token`). Do not use an Anthropic API key.
# See https://github.com/anthropics/claude-code-action/blob/main/docs/setup.md
# and examples/claude.yml, examples/pr-review-comprehensive.yml.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    # Skip drafts and bot-authored PRs so automatic reviews do not spend usage.
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Automatic PR review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and post the review on the PR.

            Focus only on real bugs, security issues, and correctness.
            Do not comment on style, formatting, naming, or other nits.
            Keep the review concise. If there is nothing important, say so in one short comment.

            Note: The PR branch is already checked out in the current working directory.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  claude:
    # Respond only to @claude. Skip bot actors, and skip draft or bot-authored
    # PRs when the event includes the pull request.
    if: |
      github.event.sender.type != 'Bot' &&
      !endsWith(github.event.sender.login, '[bot]') &&
      (
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          (
            github.event.issue.pull_request == null ||
            (
              github.event.issue.draft != true &&
              github.event.issue.user.type != 'Bot' &&
              !endsWith(github.event.issue.user.login, '[bot]')
            )
          )
        ) ||
        (
          github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        ) ||
        (
          github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.user.type != 'Bot' &&
          !endsWith(github.event.pull_request.user.login, '[bot]')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Skip draft or bot-authored pull requests
        id: gate
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}")"
          draft="$(jq -r '.draft' <<<"$pr")"
          author_type="$(jq -r '.user.type' <<<"$pr")"
          author_login="$(jq -r '.user.login' <<<"$pr")"
          skip=false
          if [ "$draft" = "true" ] || [ "$author_type" = "Bot" ]; then
            skip=true
          fi
          case "$author_login" in
            *'[bot]') skip=true ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        if: steps.gate.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
