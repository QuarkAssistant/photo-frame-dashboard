<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#E8DCC4">
  <title>Coelho de Oliveira</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/views/home.css">
  <link rel="stylesheet" href="/css/views/calendar.css">
  <link rel="stylesheet" href="/css/views/lists.css">
  <link rel="stylesheet" href="/css/views/photos.css">
</head>
<body>
  <div class="stage" id="stage">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-chores" data-view="chores"></section>
      <section class="view" id="view-grocery" data-view="grocery"></section>
      <section class="view" id="view-member" data-view="member"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
    </main>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="saver" id="saver" role="button" aria-label="Coelho de Oliveira"></div>
  </div>
  <script>
    setTimeout(function () { if (!document.documentElement.dataset.ready) location.reload(); }, 12000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
