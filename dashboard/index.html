<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#E8DCC4">
  <title>Coelho de Oliveira</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/views/home.css">
  <link rel="stylesheet" href="/css/views/calendar.css">
  <link rel="stylesheet" href="/css/views/lists.css">
  <link rel="stylesheet" href="/css/views/photos.css">
  <link rel="stylesheet" href="/css/views/weather.css">
  <link rel="stylesheet" href="/css/views/settings.css">
  <link rel="stylesheet" href="/css/views/home3.css">
  <link rel="stylesheet" href="/css/theme-dark.css">
  <link rel="stylesheet" href="/css/v2/tokens.css">
  <link rel="stylesheet" href="/css/v2/shell.css">
  <link rel="stylesheet" href="/css/v2/home.css">
  <link rel="stylesheet" href="/css/v2/calendar.css">
</head>
<body>
  <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        if (params.get('night') === 'off') return;
        var raw = params.get('now');
        var date = raw ? new Date(raw) : new Date();
        if (isNaN(date.getTime())) date = new Date();
        var fmt = new Intl.DateTimeFormat('en-US', {
          timeZone: 'America/Chicago', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
        });
        var hour = 0, minute = 0;
        fmt.formatToParts(date).forEach(function (p) {
          if (p.type === 'hour') hour = Number(p.value);
          if (p.type === 'minute') minute = Number(p.value);
        });
        if (hour === 24) hour = 0;
        var mins = hour * 60 + minute;
        if (mins >= 23 * 60 || mins < 6 * 60) document.documentElement.classList.add('is-night');
      } catch (e) {}
    })();
  </script>
  <div class="stage" id="stage">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main class="views">
      <section class="view" id="view-home" data-view="home"></section>
      <section class="view" id="view-calendar" data-view="calendar"></section>
      <section class="view" id="view-chores" data-view="chores"></section>
      <section class="view" id="view-grocery" data-view="grocery"></section>
      <section class="view" id="view-member" data-view="member"></section>
      <section class="view view--bleed" id="view-photos" data-view="photos"></section>
      <section class="view" id="view-weather" data-view="weather"></section>
      <section class="view" id="view-settings" data-view="settings"></section>
      <section class="view v2-view" id="view-family" data-view="family"></section>
      <section class="view v2-view" id="view-media" data-view="media"></section>
      <section class="view v2-view" id="view-long-drift" data-view="long-drift"></section>
      <section class="view v2-view" id="view-cameras" data-view="cameras"></section>
      <section class="view v2-view" id="view-coming-up" data-view="coming-up"></section>
    </main>
    <div class="sheet-layer" id="sheetLayer"></div>
    <div class="saver" id="saver" role="button" aria-label="Coelho de Oliveira"></div>
  </div>
  <div class="night" id="night" aria-hidden="true">
    <div class="night-clock num" data-nightclock></div>
  </div>
  <script>
    setTimeout(function () { if (!document.documentElement.dataset.ready) location.reload(); }, 12000);
  </script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
